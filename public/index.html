<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32 Aquaculture JSON Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-[#0b1329] text-gray-100 p-4 md:p-6 font-mono">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-[#152238] p-4 rounded-xl border border-slate-700">
            <div>
                <h1 class="text-base font-bold text-blue-400">STM32H7A3ZI-Q JSON Telemetry</h1>
                <p class="text-xs text-gray-400">Ao nuôi tôm công nghệ cao | SIM7680C 4G</p>
            </div>
            <div class="flex items-center space-x-2 bg-[#0b1329] px-3 py-1 rounded-lg border border-slate-700">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-xs text-emerald-400">Online</span>
            </div>
        </header>

        <!-- Khối điều khiển Downlink -->
        <div class="bg-[#152238] p-4 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-3">
            <span class="text-xs text-gray-300 font-bold">Gửi lệnh điều khiển (Downlink):</span>
            <div class="flex items-center gap-2">
                <input type="text" id="control-input" class="bg-[#0b1329] border border-slate-600 rounded px-3 py-1 text-white text-sm w-32 focus:outline-none" placeholder="Giá trị...">
                <button onclick="sendControl()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded transition">Gửi</button>
            </div>
        </div>

        <!-- Realtime JSON Stream -->
        <div class="bg-[#152238] p-5 rounded-xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-gray-400 uppercase">Realtime Uplink (JSON Stream):</h2>
                <span id="update-time" class="text-xs text-emerald-400">Chờ dữ liệu...</span>
            </div>
            <pre id="realtime-json" class="bg-[#0b1329] p-4 rounded-lg text-emerald-400 text-xs overflow-x-auto border border-slate-800">{
  "status": "Đang kết nối..."
}</pre>
        </div>

        <!-- Database Logs JSON Array -->
        <div class="bg-[#152238] p-5 rounded-xl border border-slate-700 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-gray-400 uppercase">Database Logs (/api/logs - JSON):</h2>
                <button onclick="fetchHistory()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1 rounded transition">Làm mới</button>
            </div>
            <pre id="db-json" class="bg-[#0b1329] p-4 rounded-lg text-blue-400 text-xs overflow-x-auto max-h-96 border border-slate-800">[]</pre>
        </div>

    </div>

    <script>
        const socket = io();

        socket.on('new_telemetry', (packet) => {
            document.getElementById('update-time').innerText = `Cập nhật: ${packet.time_vn}`;
            document.getElementById('realtime-json').innerText = JSON.stringify(packet.data, null, 2);
            fetchHistory();
        });

        function sendControl() {
            const val = document.getElementById('control-input').value.trim();
            if (!val) return;
            socket.emit('send_control', val);
            document.getElementById('control-input').value = '';
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/logs');
                const list = await res.json();
                document.getElementById('db-json').innerText = JSON.stringify(list, null, 2);
            } catch (err) {
                console.error(err);
            }
        }

        fetchHistory();
    </script>
</body>
</html>
