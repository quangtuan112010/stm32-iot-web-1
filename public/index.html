<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32 JSON Telemetry Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-gray-100 p-4 md:p-6 font-mono">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="flex justify-between items-center bg-slate-800 p-4 rounded-lg border border-slate-700">
            <h1 class="text-lg font-bold text-emerald-400">STM32H7A3ZI-Q JSON Data Stream</h1>
            <span class="text-xs text-gray-400">SIM7680C 4G LTE</span>
        </header>

        <!-- Khối hiển thị dữ liệu Realtime dạng JSON -->
        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-2">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Realtime Uplink (JSON Stream):</h2>
            <pre id="realtime-json" class="bg-slate-950 p-4 rounded-md text-emerald-400 text-xs overflow-x-auto max-h-48">{
  "status": "Chờ dữ liệu từ STM32..."
}</pre>
        </div>

        <!-- Khối hiển thị lịch sử Database dạng JSON -->
        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-2">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Database Logs (/api/logs - JSON Array):</h2>
                <button onclick="fetchJsonLogs()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1 rounded transition">Tải lại JSON</button>
            </div>
            <pre id="db-json" class="bg-slate-950 p-4 rounded-md text-blue-400 text-xs overflow-x-auto max-h-96">[]</pre>
        </div>

    </div>

    <script>
        const socket = io();

        // 1. Nhận dữ liệu Realtime dạng JSON
        socket.on('new_telemetry', (data) => {
            document.getElementById('realtime-json').innerText = JSON.stringify(data, null, 2);
            fetchJsonLogs(); // Tự động cập nhật lại danh sách JSON bên dưới khi có dữ liệu mới
        });

        // 2. Tải toàn bộ lịch sử từ API dưới dạng JSON
        async function fetchJsonLogs() {
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();
                document.getElementById('db-json').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                console.error(err);
            }
        }

        fetchJsonLogs();
    </script>
</body>
</html>
